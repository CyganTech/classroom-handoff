name: Verify Classroom Handoff
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker compose config --quiet
      - run: HANDOFF_DOMAIN=handoff.example.org ACME_EMAIL=admin@example.org docker compose -f compose.production.yaml config --quiet
      - run: PROXY_NETWORK=proxy docker compose -f compose.yaml -f compose.proxy.yaml config --quiet
      - run: npm run test:docker
      - uses: actions/upload-artifact@v4
        with:
          name: classroom-handoff-extension
          path: |
            artifacts/classroom-handoff-extension.zip
            artifacts/classroom-handoff-extension.zip.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
